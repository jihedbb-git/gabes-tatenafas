<section class="page">

  <!-- HEADER UNIFIE -->
  <div class="page-head">
    <div class="ph-title-block">
      <div class="ph-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
      </div>
      <div>
        <h1>Risk Zones</h1>
        <div class="ph-sub">Monitoring pollution, health risk, and reports by zone.</div>
      </div>
    </div>
  </div>

  <!-- BARRE DE RECHERCHE & ACTIONS -->
  <div class="card">
    <div class="row between" style="gap:12px;flex-wrap:wrap">
      <input id="zone-search" placeholder="Search a zone..." style="flex:1;max-width:320px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);font-size:14px;color:var(--ink)">
      <div class="row" style="gap:8px;flex-wrap:wrap">
        <button class="btn" data-sort="pollution_level">Pollution</button>
        <button class="btn" data-sort="risk_score">Risk</button>
        <button class="btn" data-sort="reports_total">Reports</button>
        <button class="btn primary" id="recompute">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
          <span>Recalculate Scores</span>
        </button>
      </div>
    </div>
  </div>

  <!-- TABLEAU DES ZONES -->
  <table class="table" id="zones-table">
    <thead><tr><th>Zone</th><th>Status</th><th>Pollution</th><th>Risk</th><th>Reports</th><th>Symptoms</th><th>Population</th></tr></thead>
    <tbody></tbody>
  </table>

</section>
