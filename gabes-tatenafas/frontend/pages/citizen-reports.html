<section class="page">

  <!-- HEADER UNIFIE -->
  <div class="page-head">
    <div class="ph-title-block">
      <div class="ph-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 11l18-7-3 18-6-7-9-4z"/>
        </svg>
      </div>
      <div>
        <h1>Citizen Reports</h1>
        <div class="ph-sub">Report pollution, odors or incidents in your area.</div>
      </div>
    </div>
  </div>

  <!-- FORMULAIRE + FEED -->
  <div class="grid grid-2">
    <div class="card">
      <h3>New Report</h3>
      <form id="form-report" enctype="multipart/form-data">
        <div class="field">
          <label>Your Name (optional)</label>
          <input name="citizen_name" placeholder="Anonymous">
        </div>
        <div class="field">
          <label>Affected Zone</label>
          <select name="zone_id" id="report-zone" required></select>
        </div>
        <div class="field">
          <label>Category</label>
          <select name="category">
            <option value="odor">Odor</option>
            <option value="smoke">Smoke</option>
            <option value="breathing">Breathing Difficulty</option>
            <option value="dust">Dust</option>
            <option value="noise">Noise</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="field">
          <label>Description</label>
          <textarea name="description" id="cr-description" placeholder="Describe what you observed..." required></textarea>
          <div class="cr-mic-row">
            <button type="button" class="cr-mic-btn" id="cr-mic-btn" title="Dictate — Whisper AI">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
              <span id="cr-mic-label">Dictate (EN/FR/AR)</span>
            </button>
            <span id="cr-mic-status" class="muted small"></span>
          </div>
        </div>

        <!-- Upload photo -->
        <div class="field cr-upload">
          <label>Photo (optional — max 4 MB · AI analyses the image)</label>
          <div class="cr-upload-row">
            <label class="cr-upload-btn" for="cr-camera">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
              <span>Take a Photo</span>
            </label>
            <label class="cr-upload-btn" for="cr-file">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              <span>Choose Image</span>
            </label>
          </div>
          <!-- input photo (caméra arrière sur mobile) -->
          <input type="file" id="cr-camera" name="image" accept="image/*" capture="environment">
          <!-- gallery input -->
          <input type="file" id="cr-file"   name="image" accept="image/*">

          <div class="cr-preview" id="cr-preview">
            <img id="cr-preview-img" alt="Photo Preview">
            <button type="button" class="remove" id="cr-preview-remove" title="Remove Photo">×</button>
          </div>
        </div>

        <div class="row" style="gap:10px">
          <button type="submit" class="btn primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            <span>Send Report</span>
          </button>
          <button type="button" class="btn danger" id="emergency-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><circle cx="12" cy="17" r="0.6" fill="currentColor"/></svg>
            <span>Emergency Button</span>
          </button>
        </div>
        <div id="report-status" class="muted" style="margin-top:10px"></div>
      </form>
    </div>

    <div class="card">
      <h3>Recent Reports (last 7)</h3>
      <div id="reports-feed"></div>
    </div>
  </div>

  <!-- Lightbox image (réutilisable, déclenchée par JS) -->
  <div class="cr-lightbox" id="cr-lightbox">
    <img id="cr-lightbox-img" alt="">
  </div>

</section>
